<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Complaint - CEWMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">Track Your Complaint</h4>
                    </div>
                    <div class="card-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_reference_number" class="form-label">Reference Number</label>
                                {{ form.reference_number }}
                            </div>
                            <div class="mb-3">
                                <label for="id_tracking_token" class="form-label">Tracking Token</label>
                                {{ form.tracking_token }}
                                <div class="form-text">Enter the secure token you received after submission.</div>
                            </div>
                            <button type="submit" class="btn btn-info w-100">Track Complaint</button>
                        </form>
                        
                        <hr>
                        <p class="text-center text-muted small">
                            Have an account? <a href="{% url 'accounts:login' %}">Log in</a> to see all your complaints.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
